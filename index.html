<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Links</title>
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Meus Links" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #22223a;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #e8e8f0; --muted: #8888aa; --accent: #7c6af7; --accent2: #a78bfa;
      --success: #34d399; --danger: #f87171; --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

    header { padding: 16px 20px 12px; position: sticky; top: 0; background: var(--bg); z-index: 100; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .logo { font-size: 17px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; transition: background 0.3s; }
    .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .sync-dot.online { background: var(--success); }
    .sync-dot.saving { background: #f59e0b; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .count-badge { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; background: var(--surface); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }

    .ws-switcher { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; border: 1px solid var(--border); }
    .ws-btn { flex: 1; padding: 7px 12px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .ws-btn.active-work { background: rgba(124,106,247,0.15); color: #a78bfa; }
    .ws-btn.active-personal { background: rgba(52,211,153,0.12); color: #34d399; }

    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); pointer-events: none; }
    input[type="search"], input[type="text"], input[type="url"], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; transition: border-color 0.2s; outline: none; }
    input[type="search"] { padding: 10px 12px 10px 38px; }
    input[type="text"], input[type="url"], select { padding: 10px 12px; }
    textarea { padding: 10px 12px; resize: vertical; min-height: 72px; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    select option { background: var(--surface2); }

    .filters-row { display: flex; align-items: center; padding: 10px 20px; overflow-x: auto; scrollbar-width: none; gap: 0; }
    .filters-row::-webkit-scrollbar { display: none; }
    .filters-inner { display: flex; gap: 6px; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .filters-inner::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
    .chip:hover { border-color: var(--accent); color: var(--accent2); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-add-cat { white-space: nowrap; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 20px; border: 1px dashed var(--border2); background: transparent; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; margin-left: 6px; flex-shrink: 0; transition: all 0.15s; }
    .btn-add-cat:hover { border-color: var(--accent); color: var(--accent2); }

    /* Migration banner */
    .migrate-banner { margin: 12px 20px 0; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius); padding: 14px 16px; }
    .migrate-banner p { font-size: 13px; color: #fbbf24; margin-bottom: 10px; line-height: 1.5; }
    .migrate-banner-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-migrate { padding: 7px 14px; border-radius: 20px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s; }
    .btn-migrate.work { background: rgba(124,106,247,0.2); color: #a78bfa; }
    .btn-migrate.personal { background: rgba(52,211,153,0.15); color: #34d399; }
    .btn-migrate:hover { opacity: 0.8; }
    .btn-migrate.dismiss { background: var(--surface2); color: var(--muted); }

    main { padding: 0 20px; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty p { margin-top: 8px; font-size: 14px; }
    .loading { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
    .cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; margin-top: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: border-color 0.2s; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card:hover { border-color: var(--border2); }
    .card-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 10px; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .btn-icon { background: var(--surface2); border: 1px solid var(--border); cursor: pointer; padding: 5px 11px; border-radius: 20px; color: var(--muted); transition: color 0.15s, border-color 0.15s; display: flex; align-items: center; gap: 5px; font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; white-space: nowrap; }
    .btn-icon:hover { color: var(--text); border-color: var(--border2); }
    .btn-icon.danger:hover { color: var(--danger); border-color: var(--danger); }
    .btn-icon.whatsapp:hover { color: #25d366; border-color: #25d366; }
    .btn-icon.open-link:hover { color: var(--accent2); border-color: var(--accent2); }
    .btn-icon.move:hover { color: #fbbf24; border-color: #fbbf24; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .cat-badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; background: rgba(124,106,247,0.15); color: #a78bfa; }
    .card-url { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

    .fab { position: fixed; bottom: 24px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(124,106,247,0.5); transition: transform 0.2s; z-index: 200; }
    .fab:hover { transform: scale(1.07); }
    .fab svg { width: 22px; height: 22px; stroke: #fff; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; backdrop-filter: blur(4px); }
    .overlay.open { display: block; }
    .drawer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding: 20px 20px 40px; z-index: 400; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); max-height: 90vh; overflow-y: auto; }
    .drawer.open { transform: translateY(0); }
    .drawer-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 20px; }
    .drawer-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; color: var(--text); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-save { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 4px; transition: opacity 0.2s; }
    .btn-save:hover { opacity: 0.88; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 24px 20px 20px; width: calc(100% - 40px); max-width: 340px; animation: fadeIn 0.15s ease; }
    .modal-icon { width: 40px; height: 40px; background: rgba(248,113,113,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .modal-icon svg { width: 20px; height: 20px; stroke: var(--danger); }
    .modal-title { font-size: 15px; font-weight: 600; text-align: center; margin-bottom: 6px; }
    .modal-desc { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 20px; line-height: 1.5; }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-cancel { padding: 10px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .btn-confirm-del { padding: 10px; border-radius: var(--radius-sm); background: var(--danger); border: none; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }

    .cat-modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 24px 20px 20px; width: calc(100% - 40px); max-width: 340px; animation: fadeIn 0.15s ease; }
    .cat-modal-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    .cat-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .cat-input-row input { flex: 1; }
    .btn-add-confirm { padding: 10px 16px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .cat-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
    .cat-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; }
    .cat-item-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
    .cat-item-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
    .btn-close-cat { width: 100%; margin-top: 16px; padding: 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }

    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-size: 13px; padding: 10px 18px; border-radius: 30px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 999; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo"><span class="logo-dot" id="logo-dot"></span>Meus Links</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="sync-indicator">
          <div class="sync-dot" id="sync-dot"></div>
          <span id="sync-label">conectando…</span>
        </div>
        <span class="count-badge" id="count">0 links</span>
      </div>
    </div>
    <div class="ws-switcher">
      <button class="ws-btn" id="ws-work" onclick="setWorkspace('work')">💼 Trabalho</button>
      <button class="ws-btn" id="ws-personal" onclick="setWorkspace('personal')">🏠 Pessoal</button>
    </div>
    <div class="search-wrap">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="search" placeholder="Buscar por título, descrição ou URL…" oninput="render()" />
    </div>
  </header>

  <div class="filters-row">
    <div class="filters-inner" id="filters-inner"></div>
    <button class="btn-add-cat" onclick="openCatModal()">+ categoria</button>
  </div>

  <div id="migrate-banner" style="display:none" class="migrate-banner">
    <p>📦 Encontramos <strong id="migrate-count">0</strong> links antigos. Para onde quer importá-los?</p>
    <div class="migrate-banner-btns">
      <button class="btn-migrate work" onclick="migrateLinks('work')">💼 Importar para Trabalho</button>
      <button class="btn-migrate personal" onclick="migrateLinks('personal')">🏠 Importar para Pessoal</button>
      <button class="btn-migrate dismiss" onclick="dismissMigration()">Ignorar</button>
    </div>
  </div>

  <main><div class="cards" id="cards"><div class="loading">🔄 Carregando seus links…</div></div></main>

  <button class="fab" onclick="openDrawer()" title="Adicionar link">
    <svg fill="none" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title" id="drawer-title">Novo link</div>
    <div class="row">
      <div class="field"><label>Título</label><input type="text" id="inp-title" placeholder="Nome do link" /></div>
      <div class="field"><label>Categoria</label><select id="inp-cat"></select></div>
    </div>
    <div class="field"><label>URL</label><input type="url" id="inp-url" placeholder="https://…" /></div>
    <div class="field"><label>Descrição <span style="color:var(--muted);font-weight:400">(opcional)</span></label><textarea id="inp-desc" placeholder="Para que serve este link?"></textarea></div>
    <button class="btn-save" onclick="saveLink()">Salvar</button>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-icon"><svg fill="none" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>
      <div class="modal-title">Excluir link?</div>
      <div class="modal-desc" id="modal-desc">Esta ação não pode ser desfeita.</div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-confirm-del" onclick="confirmDelete()">Excluir</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="cat-modal-overlay">
    <div class="cat-modal">
      <div class="cat-modal-title" id="cat-modal-title">Categorias</div>
      <div class="cat-input-row">
        <input type="text" id="inp-new-cat" placeholder="Nova categoria…" onkeydown="if(event.key==='Enter')addCategory()" />
        <button class="btn-add-confirm" onclick="addCategory()">Adicionar</button>
      </div>
      <div class="cat-list" id="cat-list"></div>
      <button class="btn-close-cat" onclick="closeCatModal()">Fechar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWXVKnLb0cjqkkO_4mPLY_D8LFlmJrX8c",
      authDomain: "meus-links-b40e9.firebaseapp.com",
      projectId: "meus-links-b40e9",
      storageBucket: "meus-links-b40e9.firebasestorage.app",
      messagingSenderId: "747194998453",
      appId: "1:747194998453:web:93ed9c299df6bbc6dce8fc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DEFAULT_CATS = {
      work: ['Projetos', 'Ferramentas', 'Referência', 'Reuniões', 'Outros'],
      personal: ['Lazer', 'Compras', 'Saúde', 'Estudo', 'Outros']
    };

    let workspace = 'work';
    let links = [];
    let categories = { work: [...DEFAULT_CATS.work], personal: [...DEFAULT_CATS.personal] };
    let activeFilter = 'todos';
    let editDocId = null;
    let pendingDeleteId = null;
    let oldLinks = [];
    let unsub = null;

    function setSyncStatus(s) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (s === 'online') { dot.className = 'sync-dot online'; label.textContent = 'sincronizado'; }
      else if (s === 'saving') { dot.className = 'sync-dot saving'; label.textContent = 'salvando…'; }
      else { dot.className = 'sync-dot'; label.textContent = 'conectando…'; }
    }

    async function loadCategories() {
      const ref = doc(db, 'config', 'categories');
      const snap = await getDoc(ref);
      if (snap.exists()) categories = snap.data();
      else await setDoc(ref, categories);
      renderFilters();
    }

    async function saveCategories() {
      await setDoc(doc(db, 'config', 'categories'), categories);
    }

    // Check for old links to migrate
    async function checkOldLinks() {
      const dismissed = localStorage.getItem('migration-dismissed');
      if (dismissed) return;
      const snap = await getDocs(collection(db, 'links'));
      if (!snap.empty) {
        oldLinks = snap.docs.map(d => ({ ...d.data(), docId: d.id }));
        document.getElementById('migrate-count').textContent = oldLinks.length;
        document.getElementById('migrate-banner').style.display = 'block';
      }
    }

    window.migrateLinks = async (target) => {
      if (!oldLinks.length) return;
      setSyncStatus('saving');
      const targetCol = collection(db, `links_${target}`);
      const defaultCat = target === 'work' ? 'Outros' : 'Outros';
      for (const l of oldLinks) {
        const cat = categories[target].includes(l.cat) ? l.cat : defaultCat;
        await addDoc(targetCol, { title: l.title, url: l.url, desc: l.desc || '', cat, ts: l.ts || Date.now() });
      }
      document.getElementById('migrate-banner').style.display = 'none';
      localStorage.setItem('migration-dismissed', '1');
      toast(`✓ ${oldLinks.length} links importados para ${target === 'work' ? 'Trabalho' : 'Pessoal'}!`);
      oldLinks = [];
      if (workspace === target) listenLinks();
    };

    window.dismissMigration = () => {
      document.getElementById('migrate-banner').style.display = 'none';
      localStorage.setItem('migration-dismissed', '1');
    };

    function listenLinks() {
      if (unsub) unsub();
      const colRef = collection(db, `links_${workspace}`);
      const q = query(colRef, orderBy("ts", "desc"));
      unsub = onSnapshot(q, (snap) => {
        links = snap.docs.map(d => ({ ...d.data(), docId: d.id }));
        setSyncStatus('online');
        render();
      }, () => setSyncStatus('offline'));
    }

    window.setWorkspace = (ws) => {
      workspace = ws;
      activeFilter = 'todos';
      document.getElementById('ws-work').className = 'ws-btn' + (ws === 'work' ? ' active-work' : '');
      document.getElementById('ws-personal').className = 'ws-btn' + (ws === 'personal' ? ' active-personal' : '');
      document.getElementById('logo-dot').style.background = ws === 'work' ? '#7c6af7' : '#34d399';
      renderFilters();
      listenLinks();
    };

    window.setFilter = (f, el) => {
      activeFilter = f;
      document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    };

    function renderFilters() {
      const cats = categories[workspace] || [];
      document.getElementById('filters-inner').innerHTML =
        `<button class="chip ${activeFilter === 'todos' ? 'active' : ''}" onclick="setFilter('todos',this)">Todos</button>` +
        cats.map(c => `<button class="chip ${activeFilter === c ? 'active' : ''}" onclick="setFilter('${esc(c)}',this)">${esc(c)}</button>`).join('');
    }

    window.openDrawer = (docId) => {
      editDocId = docId || null;
      const cats = categories[workspace] || [];
      const c = document.getElementById('inp-cat');
      c.innerHTML = cats.map(cat => `<option value="${esc(cat)}">${esc(cat)}</option>`).join('');
      document.getElementById('drawer-title').textContent = docId ? 'Editar link' : 'Novo link';
      if (docId) {
        const l = links.find(x => x.docId === docId);
        document.getElementById('inp-title').value = l.title;
        document.getElementById('inp-url').value = l.url;
        document.getElementById('inp-desc').value = l.desc || '';
        c.value = l.cat;
      } else {
        document.getElementById('inp-title').value = '';
        document.getElementById('inp-url').value = '';
        document.getElementById('inp-desc').value = '';
        if (cats.length) c.value = cats[0];
      }
      document.getElementById('overlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
      setTimeout(() => document.getElementById('inp-title').focus(), 300);
    };

    window.closeDrawer = () => {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
    };

    window.saveLink = async () => {
      const title = document.getElementById('inp-title').value.trim();
      const url   = document.getElementById('inp-url').value.trim();
      const desc  = document.getElementById('inp-desc').value.trim();
      const cat   = document.getElementById('inp-cat').value;
      if (!title || !url) { toast('Preencha o título e a URL'); return; }
      setSyncStatus('saving');
      try {
        if (editDocId) {
          await updateDoc(doc(db, `links_${workspace}`, editDocId), { title, url, desc, cat });
          toast('Link atualizado!');
        } else {
          await addDoc(collection(db, `links_${workspace}`), { title, url, desc, cat, ts: Date.now() });
          toast('Link salvo! ✓');
        }
        closeDrawer();
      } catch(e) { toast('Erro ao salvar.'); setSyncStatus('online'); }
    };

    // Move link to other workspace
    window.moveLink = async (docId) => {
      const l = links.find(x => x.docId === docId);
      const target = workspace === 'work' ? 'personal' : 'work';
      const targetLabel = target === 'work' ? 'Trabalho' : 'Pessoal';
      const targetCats = categories[target] || [];
      const cat = targetCats.includes(l.cat) ? l.cat : (targetCats[targetCats.length - 1] || 'Outros');
      setSyncStatus('saving');
      try {
        await addDoc(collection(db, `links_${target}`), { title: l.title, url: l.url, desc: l.desc || '', cat, ts: l.ts || Date.now() });
        await deleteDoc(doc(db, `links_${workspace}`, docId));
        toast(`Link movido para ${targetLabel}!`);
      } catch(e) { toast('Erro ao mover.'); setSyncStatus('online'); }
    };

    window.removeLink = (docId) => {
      pendingDeleteId = docId;
      const l = links.find(x => x.docId === docId);
      document.getElementById('modal-desc').textContent = '"' + l.title + '" será removido permanentemente.';
      document.getElementById('modal-overlay').classList.add('open');
    };

    window.closeModal = () => {
      document.getElementById('modal-overlay').classList.remove('open');
      pendingDeleteId = null;
    };

    window.confirmDelete = async () => {
      if (!pendingDeleteId) return;
      setSyncStatus('saving');
      try {
        await deleteDoc(doc(db, `links_${workspace}`, pendingDeleteId));
        toast('Link excluído.');
      } catch(e) { toast('Erro ao excluir.'); setSyncStatus('online'); }
      closeModal();
    };

    window.shareWhatsapp = (docId) => {
      const l = links.find(x => x.docId === docId);
      const text = encodeURIComponent((l.desc ? l.desc + '\n' : '') + l.url);
      window.open('https://wa.me/?text=' + text, '_blank');
    };

    window.openCatModal = () => {
      document.getElementById('cat-modal-title').textContent = `Categorias — ${workspace === 'work' ? 'Trabalho' : 'Pessoal'}`;
      renderCatList();
      document.getElementById('cat-modal-overlay').classList.add('open');
      setTimeout(() => document.getElementById('inp-new-cat').focus(), 200);
    };

    window.closeCatModal = () => {
      document.getElementById('cat-modal-overlay').classList.remove('open');
      document.getElementById('inp-new-cat').value = '';
    };

    window.addCategory = async () => {
      const val = document.getElementById('inp-new-cat').value.trim();
      if (!val) return;
      if (categories[workspace].includes(val)) { toast('Categoria já existe.'); return; }
      categories[workspace].push(val);
      await saveCategories();
      renderCatList(); renderFilters();
      document.getElementById('inp-new-cat').value = '';
      toast('Categoria adicionada!');
    };

    window.deleteCategory = async (cat) => {
      if (links.some(l => l.cat === cat)) { toast('Remova os links desta categoria primeiro.'); return; }
      categories[workspace] = categories[workspace].filter(c => c !== cat);
      await saveCategories();
      renderCatList(); renderFilters();
      toast('Categoria removida.');
    };

    function renderCatList() {
      const cats = categories[workspace] || [];
      document.getElementById('cat-list').innerHTML = cats.map(c => `
        <div class="cat-item">
          <span>${esc(c)}</span>
          <button class="cat-item-del" onclick="deleteCategory('${esc(c)}')">🗑️</button>
        </div>`).join('') || '<p style="font-size:13px;color:var(--muted);text-align:center;padding:10px">Nenhuma categoria.</p>';
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = links.filter(l => {
        const matchCat = activeFilter === 'todos' || l.cat === activeFilter;
        const matchQ = !q || l.title.toLowerCase().includes(q) || (l.desc||'').toLowerCase().includes(q) || l.url.toLowerCase().includes(q);
        return matchCat && matchQ;
      });
      document.getElementById('count').textContent = filtered.length + (filtered.length === 1 ? ' link' : ' links');
      const container = document.getElementById('cards');
      const moveLabel = workspace === 'work' ? '🏠 Mover para Pessoal' : '💼 Mover para Trabalho';
      if (!filtered.length) {
        container.innerHTML = `<div class="empty"><svg width="40" height="40" fill="none" stroke="var(--muted)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg><p>Nenhum link encontrado.</p></div>`;
        return;
      }
      container.innerHTML = filtered.map(l => `
        <div class="card">
          <div class="card-title">${esc(l.title)}</div>
          ${l.desc ? `<div class="card-desc">${esc(l.desc)}</div>` : ''}
          <div class="card-actions">
            <button class="btn-icon open-link" onclick="window.open('${esc(l.url)}','_blank')">🔗 Abrir</button>
            <button class="btn-icon whatsapp" onclick="shareWhatsapp('${l.docId}')">💬 WhatsApp</button>
            <button class="btn-icon move" onclick="moveLink('${l.docId}')">${moveLabel}</button>
            <button class="btn-icon" onclick="openDrawer('${l.docId}')">✏️ Editar</button>
            <button class="btn-icon danger" onclick="removeLink('${l.docId}')">🗑️ Excluir</button>
          </div>
          <div class="card-footer">
            <span class="cat-badge">${esc(l.cat)}</span>
            <span class="card-url">${esc(l.url)}</span>
          </div>
        </div>
      `).join('');
    }

    await loadCategories();
    await checkOldLinks();
    setWorkspace('work');
  </script>
</body>
</html>
